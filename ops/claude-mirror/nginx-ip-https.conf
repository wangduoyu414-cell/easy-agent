server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 43.161.214.205;

    server_tokens off;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 404; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 43.161.214.205;

    server_tokens off;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/43.161.214.205-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.161.214.205-ip/privkey.pem;
    ssl_session_cache shared:hongkong_ip_ssl:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ "^/manifests/claude/(?:windows|macos)/(?:x64|arm64)/latest\.json$" {
        root /srv/easy-agent/private;
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location ~ "^/manifests/claude/(?:windows|macos)/(?:x64|arm64)/latest\.json\.minisig$" {
        root /srv/easy-agent/private;
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location ~ "^/artifacts/claude/windows/(?:x64|arm64)/[0-9]+(?:\.[0-9]+){2,3}/[0-9a-f]{64}/ClaudeSetup\.exe$" {
        root /srv/easy-agent/private;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location ~ "^/artifacts/claude/windows/(?:x64|arm64)/[0-9]+(?:\.[0-9]+){2,3}/[0-9a-f]{64}/Claude\.msix$" {
        root /srv/easy-agent/private;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location ~ "^/artifacts/claude/macos/(?:x64|arm64)/[0-9]+(?:\.[0-9]+){2,3}/[0-9a-f]{64}/Claude\.dmg$" {
        root /srv/easy-agent/private;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location = /manifests/chatgpt/macos/x64/latest.json {
        alias /srv/easy-agent/private/manifests/chatgpt/macos/x64/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location = /manifests/chatgpt/macos/x64/latest.json.minisig {
        alias /srv/easy-agent/private/manifests/chatgpt/macos/x64/latest.json.minisig;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location = /manifests/chatgpt/macos/arm64/latest.json {
        alias /srv/easy-agent/private/manifests/chatgpt/macos/arm64/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location = /manifests/chatgpt/macos/arm64/latest.json.minisig {
        alias /srv/easy-agent/private/manifests/chatgpt/macos/arm64/latest.json.minisig;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location ~ "^/artifacts/chatgpt/macos/x64/[0-9]+(?:\.[0-9]+)+/[0-9a-f]{64}/ChatGPT-darwin-x64-[0-9]+(?:\.[0-9]+)+\.zip$" {
        root /srv/easy-agent/private;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location ~ "^/artifacts/chatgpt/macos/arm64/[0-9]+(?:\.[0-9]+)+/[0-9a-f]{64}/ChatGPT-darwin-arm64-[0-9]+(?:\.[0-9]+)+\.zip$" {
        root /srv/easy-agent/private;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location / { return 404; }
}
