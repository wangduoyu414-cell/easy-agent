name: Build easy agent macOS Universal validation DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Universal DMG validated on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          components: rustfmt,clippy

      - name: Cache Rust build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-universal-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/build-macos.sh', 'packaging/macos/Info.plist') }}

      - name: Build ad-hoc signed Universal DMG
        env:
          ALLOW_UNSIGNED_MACOS_BUILD: "1"
        run: bash ./packaging/build-macos.sh

      - name: Record architecture and signatures
        run: |
          lipo -info "dist/easy agent.app/Contents/MacOS/easy-agent"
          codesign --verify --deep --strict --verbose=2 "dist/easy agent.app"
          codesign --verify --verbose=2 "dist/easy-agent-macos-universal-UNNOTARIZED-VALIDATION.dmg"
          shasum -a 256 "dist/easy-agent-macos-universal-UNNOTARIZED-VALIDATION.dmg"

      - name: Upload validation DMG
        uses: actions/upload-artifact@v6
        with:
          name: easy-agent-macos-universal-validation-${{ runner.arch }}
          path: |
            dist/easy-agent-macos-universal-UNNOTARIZED-VALIDATION.dmg
            dist/SHA256SUMS-macos-universal-UNNOTARIZED-VALIDATION.txt
          if-no-files-found: error
          retention-days: 7
