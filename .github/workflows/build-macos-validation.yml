name: Build easy agent macOS Universal validation DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          components: rustfmt,clippy

      - name: Cache Rust build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-universal-${{ hashFiles('Cargo.lock') }}

      - name: Build ad-hoc signed Universal DMG
        env:
          ALLOW_UNSIGNED_MACOS_BUILD: "1"
        run: bash ./packaging/build-macos.sh

      - name: Record architecture and signatures
        run: |
          lipo -info "dist/easy agent.app/Contents/MacOS/easy-agent"
          codesign --verify --deep --strict --verbose=2 "dist/easy agent.app"
          codesign --verify --verbose=2 "dist/easy-agent-macos-universal-UNNOTARIZED-VALIDATION.dmg"
          shasum -a 256 "dist/easy-agent-macos-universal-UNNOTARIZED-VALIDATION.dmg"

      - name: Upload validation DMG
        uses: actions/upload-artifact@v6
        with:
          name: easy-agent-macos-universal-validation
          path: |
            dist/easy-agent-macos-universal-UNNOTARIZED-VALIDATION.dmg
            dist/SHA256SUMS-macos-universal-UNNOTARIZED-VALIDATION.txt
          if-no-files-found: error
          retention-days: 7
