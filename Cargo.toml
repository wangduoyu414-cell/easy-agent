[package]
name = "ai-client-installer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fail-closed installer assistant for five fixed AI desktop clients"

[dependencies]
base64 = "0.22"
crossbeam-channel = "0.5"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
hex = "0.4"
minisign-verify = "0.2.5"
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tempfile = "3.20"
thiserror = "2.0"
toml = { version = "1.1.4", features = ["parse", "serde"] }
url = "2.5"
zip = { version = "4.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
httpmock = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
